upstream babybuddy {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Static files are the committed build output from the mounted checkout.
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # User-uploaded media (child photos, note images).
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://babybuddy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
